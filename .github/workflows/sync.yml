name: sync

# 15분마다 Vercel의 /api/cron/sync를 부른다. 수집 자체와 Meta·Google 토큰은 Vercel에만 있다.
# GitHub 예약 실행은 몇 분~수십 분 늦거나 빠질 수 있다. 수집 간격은 실제 시각 기준으로 판정하므로 괜찮다.
# 정각(:00)은 GitHub 예약이 몰려 밀리기 쉬워 7분부터 15분 간격으로 돈다.
# 공개 레포라 로그가 공개된다. 응답 본문은 찍지 않고 상태와 건수만 남긴다.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "30일 이내 편은 간격과 상관없이 수집"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger collector
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SYNC_URL 또는 CRON_SECRET이 설정되지 않았다."
            exit 1
          fi
          call() {
            curl -sS -o resp.json -w '%{http_code}' --max-time 75 -X POST "$SYNC_URL" \
              -H "Authorization: Bearer $CRON_SECRET" -H "X-Sync-Force: $FORCE" || echo 000
          }
          code=$(call)
          if [ "$code" = "000" ] || [ "${code:0:1}" = "5" ]; then
            echo "응답 $code: 20초 뒤 한 번 다시 시도"
            sleep 20
            code=$(call)
          fi
          status=$(jq -r '.status // "?"' resp.json 2>/dev/null || echo "?")
          ig=$(jq -r '.ig.captured // "-"' resp.json 2>/dev/null || echo "-")
          yt=$(jq -r '.yt.captured // "-"' resp.json 2>/dev/null || echo "-")
          echo "HTTP $code · $status · 인스타 $ig · 유튜브 $yt"
          case "$code" in
            200)
              if [ "$status" = "failed" ]; then echo "::error::수집 실패(관리자 화면의 수집 로그 확인)"; exit 1; fi
              if [ "$status" = "partial" ]; then echo "::warning::일부만 수집(관리자 화면의 수집 로그 확인)"; fi
              ;;
            409|429) echo "::notice::다른 수집이 진행 중이거나 방금 수집했다($code)." ;;
            401) echo "::error::CRON_SECRET이 Vercel 값과 다르다."; exit 1 ;;
            *) echo "::error::수집 엔드포인트 오류($code)"; exit 1 ;;
          esac
